<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ============================================================
  EDITABLE — change everything in this block freely
  ============================================================ -->
<script>

const TIMEZONE = "Asia/Seoul";  /* keep in sync with index.html */
const CITY     = "Seoul";       /* keep in sync with index.html */
const BACK     = "../index.html";   /* path to the index page */

/* ── Page content ─────────────────────────────────────────────
   Write in standard Markdown.
   Indent doesn't matter — just keep the backticks on their own lines.
   ────────────────────────────────────────────────────────── */
const MARKDOWN = `
# Temporary power layouts
General notes regarding temporary
power systems for commercial sites.

---

## Considerations
- feeder sizing
- voltage drop
- equipment access
- weather exposure

---

## Common issues
Improper temporary routing often causes:
- damaged cable runs
- overloaded feeders
- unsafe maintenance access

---

## Example
\`\`\`
Main Distribution
    ↓
Temporary Panel
    ↓
Site Equipment
\`\`\`

---

## Notes
This page is fully written in markdown.
You only edit the markdown section.
`;

</script>
<!-- ============================================================
  END EDITABLE
  ============================================================ -->




<!-- ============================================================
  BACKEND — no need to touch below
  ============================================================ -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Shared tokens — keep in sync with index.html ────────────
     max-width:   500px
     padding:     0 20px
     font-size:   13px
     line-height: 1.7
     margin-top:  40px here (has ← back link) / 80px in index
  ────────────────────────────────────────────────────────── */
  body {
    font-family: Inter, sans-serif;
    background: #fff;
    color: #111;
    max-width: 500px;
    margin: 40px auto;
    padding: 0 20px;
    font-size: 13px;
    line-height: 1.7;
  }

  /* Markdown content */
  #content h1,
  #content h2,
  #content h3 { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  #content p                { margin: 14px 0; }
  #content ul, #content ol  { padding-left: 18px; margin: 14px 0; }
  #content li               { margin: 6px 0; }
  #content code             { background: #f3f3f3; padding: 2px 5px; }
  #content pre              { background: #f5f5f5; padding: 14px; overflow: auto; margin: 20px 0; }
  #content pre code         { background: none; padding: 0; }
  #content blockquote       { border-left: 1px solid #ddd; padding-left: 14px; color: #777; margin: 20px 0; }
  #content img              { width: 100%; margin: 20px 0; }
  #content a                { color: inherit; }
  #content hr               { border: none; border-top: 1px solid #ddd; margin-bottom: 10px;}

  .back { display: inline-block; margin-bottom: 20px; color: #777; text-decoration: none; }
  .back:hover { color: #111; }

  .footer { margin-top: 80px; color: #777; }
</style>
</head>
<body>

  <a class="back" id="j-back">← back</a>
  <div id="content"></div>
  <div class="footer" id="j-time"></div>

<script>
  /* ── Populate content ── */
  document.getElementById("j-back").href      = BACK;
  document.getElementById("content").innerHTML = marked.parse(MARKDOWN);

  /* ── Live clock ── */
  function updateTime() {
    const now  = new Date();
    const time = now.toLocaleTimeString("en-GB", { timeZone: TIMEZONE, hour: "2-digit", minute: "2-digit" });
    const date = now.toLocaleDateString("en-US",  { timeZone: TIMEZONE, month: "short", day: "numeric", year: "numeric" });
    document.getElementById("j-time").textContent = `${time} in ${CITY} — ${date}`;
  }
  updateTime();
  setInterval(updateTime, 30000);
</script>
<!-- END BACKEND -->

</body>
</html>
