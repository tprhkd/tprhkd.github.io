  ];

  // NOTES — each belongs to a chapter (section id matches CHAPTERS[*].id)
  // topics & descriptions reflect real construction electrical engineering tasks
  const NOTES = [
    // Chapter 1: Site Fundamentals
    { section: "site-fundamentals", topic: "Temporary Construction Power", description: "Sizing temporary distribution, transformer rentals, and site load phasing.", href: "site/temporary-power.html" },
    { section: "site-fundamentals", topic: "Site Power Assessment", description: "Demand factors for construction offices, lighting, cranes and lifts.", href: "site/power-assessment.html" },
    { section: "site-fundamentals", topic: "Load Scheduling & Coordination", description: "Coordinating with GC, avoiding peak clashes, and daily load logs.", href: "site/load-scheduling.html" },
    { section: "site-fundamentals", topic: "Utility Coordination", description: "Lead times, transformer pads, metering, and temporary vs permanent feed.", href: "site/utility-coordination.html" },

    // Chapter 2: Power Distribution
    { section: "power-distribution", topic: "Transformer Sizing", description: "KVA calculations, impedance, and site-specific ambient adjustments.", href: "distribution/transformer-sizing.html" },
    { section: "power-distribution", topic: "Switchgear & Panelboards", description: "Series ratings, selective coordination, and construction sequencing.", href: "distribution/switchgear-basics.html" },
    { section: "power-distribution", topic: "Feeder & Conductor Sizing", description: "Ampacity, derating, voltage drop for long runs on construction sites.", href: "distribution/feeder-sizing.html" },
    { section: "power-distribution", topic: "Voltage Drop Calculations", description: "Field formulas, acceptable limits for temporary and permanent feeders.", href: "distribution/voltage-drop.html" },

    // Chapter 3: Grounding, Bonding & Protection
    { section: "grounding-bonding", topic: "Earth Resistance Testing", description: "Fall-of-potential method, soil resistivity, and driven rods on site.", href: "grounding/earth-testing.html" },
    { section: "grounding-bonding", topic: "Equipment Grounding", description: "Proper GEC connections, rebar bonding, and equipment grounding conductors.", href: "grounding/equipment-grounding.html" },
    { section: "grounding-bonding", topic: "System Bonding & Intersystem Bonding", description: "Main bonding jumper, gas/water bonding, and telecom bonding.", href: "grounding/system-bonding.html" },
    { section: "grounding-bonding", topic: "Lightning Protection for Structures", description: "Risk assessment, air terminals, and down conductors on buildings.", href: "grounding/lightning-protection.html" },

    { section: "safety-code", topic: "Arc Flash & PPE", description: "Incident energy analysis, boundaries, and required PPE on active sites.", href: "safety/arc-flash.html" },
    { section: "safety-code", topic: "Lockout/Tagout Procedures", description: "LOTO for temporary panels, disconnects, and energized work.", href: "safety/loto-procedures.html" },

  END EDITABLE (preserve fonts & sizes)
  ============================================================ -->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    max-width: 700px;
    margin: 70px auto;
    padding: 0 20px;
    font: 12px/1.7 Inter, sans-serif;
    background: #fff;
    color: #111;
  }

  a { color: inherit; text-decoration: none; }
  .gray { color: #777; }

  .back { display: inline-block; margin-bottom: 40px; color: #777; }
  .back:hover { color: #111; }

  /* main title / playbook header (no font change, uses existing sizes) */
  .playbook-title {
    font-size: 12px;
    letter-spacing: -0.2px;
    margin-bottom: 6px;
  }
  .playbook-sub {
    color: #777;
    margin-bottom: 48px;
    font-size: 12px;
  }

  /* chapter headings — clean, same font scale as original timeline-year */
  .chapter-head {
    margin: 32px 0 10px 0;
    font-size: 12px;
    color: #111;
    padding-bottom: 4px;
  }
  .chapter-head:first-of-type {
    margin-top: 0;
  }

  /* notes list container */
  .notes {
    margin-top: 0;
  }

  /* entry card: EXACT original style (border, hover, padding) */
  .note {
    display: block;
    padding: 10px 0;
    border-top: 1px solid #e5e5e5;
    transition: background .15s, padding-left .15s;
  }
  .note:hover {
    background: #f5f5f5;
  }
  /* maintain bottom border on last note per chapter, but overall looks fine */
  .notes .note:last-child {
    border-bottom: none;
  }
  .chapter-notes .note:last-child {
    border-bottom: 1px solid #e5e5e5;
  }

  .note-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .note-numbering {
    font-size: 11px;
    font-feature-settings: "tnum";
    letter-spacing: 0;
    padding: 2px 6px;
    line-height: 1.4;
  }
  .note-title {
    color: #111;
  }
  .note-desc {
    margin-top: 2px;
    font-size: 12px;
    line-height: 1.6;
    color: #777;
  }

  /* optional footer (unchanged) */
  .footer {
    margin-top: 80px;
    color: #777;
  }

  /* no filters, no tabs — everything is chapter based */
  @media (max-width: 640px) {
    .note-numbering {
      font-size: 10px;
      padding: 2px 5px;
    }
  }
</style>
</head>
<body>

<a class="back" id="j-back">← back</a>

<div class="notes" id="j-notes"></div>

<div class="footer" id="j-time"></div>

<script>
  (function() {
    // set back link
    const backLink = document.getElementById("j-back");
    if (backLink) backLink.href = BACK;

    // helper: escape HTML (preserve safe rendering)
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // build chapter map (id -> chapter data, including number)
    const chapterMap = new Map();
    CHAPTERS.forEach(ch => {
      chapterMap.set(ch.id, ch);
    });

    // group notes by chapter id (preserve original order inside each chapter)
    function groupNotesByChapter() {
      const groups = new Map(); // chapterId -> array of notes
      NOTES.forEach(note => {
        const sec = note.section;
        if (!groups.has(sec)) groups.set(sec, []);
        groups.get(sec).push(note);
      });
      return groups;
    }

    // render entire playbook: chapters in defined order, each with numbered notes
    function renderPlaybook() {
      const container = document.getElementById("j-notes");
      if (!container) return;
      container.innerHTML = "";

      const grouped = groupNotesByChapter();

      // iterate over CHAPTERS order (this defines chapter sequence)
      for (let chIdx = 0; chIdx < CHAPTERS.length; chIdx++) {
        const chapter = CHAPTERS[chIdx];
        const chapterId = chapter.id;
        const chapterNumber = chapter.number;
        const chapterTitle = chapter.title;
        const notesInChapter = grouped.get(chapterId) || [];

        if (notesInChapter.length === 0) continue;

        // create chapter heading div (uses same font scale, no external changes)
        const headingDiv = document.createElement("div");
        headingDiv.className = "chapter-head";
        headingDiv.textContent = `${chapterNumber}. ${chapterTitle}`;
        container.appendChild(headingDiv);

        // wrapper to hold notes for this chapter (keeps consistent spacing)
        const chapterNotesDiv = document.createElement("div");
        chapterNotesDiv.className = "chapter-notes";

        // add each note with numbering (X.Y format)
        notesInChapter.forEach((note, idx) => {
          const noteNumber = `${chapterNumber}.${idx + 1}`;
          const noteLink = document.createElement("a");
          noteLink.className = "note";
          noteLink.href = note.href;

          // handle pdf links (open in new tab)
          if (note.href && note.href.toLowerCase().endsWith(".pdf")) {
            noteLink.target = "_blank";
          }

          // inner structure: same as original note-top + desc
          // we replace the old tag with numbering + title
          noteLink.innerHTML = `
            <div class="note-top">
              <span class="note-numbering">${escapeHtml(noteNumber)}</span>
              <span class="note-title">${escapeHtml(note.topic)}</span>
            </div>
            <div class="note-desc">${escapeHtml(note.description)}</div>
          `;
          chapterNotesDiv.appendChild(noteLink);
        });

        container.appendChild(chapterNotesDiv);
      }

      // if no notes at all (fallback empty state)
      if (container.children.length === 0) {
        const emptyMsg = document.createElement("div");
        emptyMsg.className = "empty";
        emptyMsg.style.padding = "32px 0";
        emptyMsg.style.color = "#aaa";
        emptyMsg.textContent = "No chapters or notes defined yet.";
        container.appendChild(emptyMsg);
      }
    }

    // time & location (exactly same as original index, untouched fonts)
    const TIMEZONE = "Asia/Seoul";
    const CITY = "Seoul";

    function updateTime() {
      const now = new Date();
      const time = now.toLocaleTimeString("en-GB", {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit"
      });
      const date = now.toLocaleDateString("en-US", {
        timeZone: TIMEZONE,
        month: "short",
        day: "numeric",
        year: "numeric"
      });
      const timeEl = document.getElementById("j-time");
      if (timeEl) timeEl.textContent = `${time} in ${CITY} — ${date}`;
    }

    // initialize everything
    renderPlaybook();
    updateTime();
    setInterval(updateTime, 30000);
  })();
</script>
</body>
</html>
