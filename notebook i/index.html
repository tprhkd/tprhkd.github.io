<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebook I</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">

<!-- ============================================================
  EDITABLE
  ============================================================ -->
<script>

const BACK        = "../index.html";

const allSections = [
  "Foundations",
  "Circuit Analysis",
];

const NOTES = [

  {
    section: "Foundations",
    topic: "Introduction",
    description: "Organization, notation, and study philosophy.",
    href: "foundations/introduction"
  },

  {
    section: "Foundations",
    topic: "Units and Conventions",
    description: "SI units, prefixes, symbols, and notation.",
    href: "foundations/units-and-conventions.html"
  },

  {
    section: "Mathematics",
    topic: "Complex Numbers",
    description: "Polar form, Euler's identity, and phasor representation.",
    href: "mathematics/complex-numbers.html"
  },

  {
    section: "Circuit Analysis",
    topic: "Nodal Analysis",
    description: "Systematic circuit solving using node voltages.",
    href: "circuit-analysis/nodal-analysis.html"
  }

];

</script>
<!-- ============================================================
  END EDITABLE
  ============================================================ -->




<!-- ============================================================
  BACKEND
  ============================================================ -->
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  max-width: 700px;
  margin: 70px auto;
  padding: 0 20px;
  font: 12px/1.7 Inter, sans-serif;
  background: #fff;
  color: #111;
}

a { color: inherit; text-decoration: none; }
.gray { color: #777; }

.back { display: inline-block; margin-bottom: 40px; color: #777; }
.back:hover { color: #111; }

h1 { font-size: 12px; font-weight: 400; }
.desc { color: #777; margin-top: 2px; margin-bottom: 50px; }

/* tag filter */
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.filter-btn {
  font: 11px/1 Inter, sans-serif;
  background: none;
  border: 1px solid #e5e5e5;
  color: #777;
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
  transition: all .12s;
}
.filter-btn:hover { border-color: #bbb; color: #111; }
.filter-btn.on { background: #111; border-color: #111; color: #fff; }

/* notes list */
.notes { margin-top: 0; }

.note {
  display: block;
  padding: 10px 0;
  border-top: 1px solid #e5e5e5;
  transition: background .15s, padding-left .15s;
}
.note:hover { background: #f5f5f5; padding-left: 6px; }
.note:last-child { border-bottom: 1px solid #e5e5e5; }

.note-top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.note-title { color: #111; }
.note-tag   { font-size: 11px; color: #777; }
.note-date  { font-size: 11px; color: #aaa; margin-left: auto; }

.note-desc {
  margin-top: 2px;
  font-size: 12px;
  line-height: 1.6;
  color: #777;
}

.empty {
  padding: 32px 0;
  color: #aaa;
  font-size: 12px;
}

.footer { margin-top: 80px; color: #777; }

</style>
</head>
<body>

  <a class="back" id="j-back">← back</a>

  <div class="filters" id="j-filters"></div>
  <div class="notes"   id="j-notes"></div>

  <div class="footer"  id="j-time"></div>

<script>

  document.getElementById("j-back").href        = BACK;

  /* ── Tag filter ── */

let activeSection = "Foundations";

const filtersEl = document.getElementById("j-filters");

allSections.forEach(section => {

  const b = document.createElement("button");

  b.className =
    "filter-btn" +
    (section === activeSection ? " on" : "");

  b.textContent = section;

  b.onclick = () => {

    activeSection = section;

    document
      .querySelectorAll(".filter-btn")
      .forEach(x => x.classList.remove("on"));

    b.classList.add("on");

    render();
  };

  filtersEl.appendChild(b);
});

  /* ── Render notes ── */
const notesEl = document.getElementById("j-notes");

function render() {

  // Clear previous content every time
  notesEl.innerHTML = "";

  const filtered = NOTES.filter(
    n => n.section === activeSection
  );

  if (filtered.length === 0) {
    notesEl.innerHTML =
      '<div class="empty">No notes in this category yet.</div>';
    return;
  }

  filtered.forEach(n => {

    const a = document.createElement("a");

    a.className = "note";
    a.href = n.href;

    if (n.href.endsWith(".pdf")) {
      a.target = "_blank";
    }

    a.innerHTML = `
      <div class="note-top">
        <span class="note-title">${n.topic}</span>
        <span class="note-tag">${n.section}</span>
      </div>

      <div class="note-desc">
        ${n.description}
      </div>
    `;

    notesEl.appendChild(a);

  });
}

render();

  /* ── Clock (matches index.html) ── */
  const TIMEZONE = "Asia/Seoul";
  const CITY     = "Seoul";

  function updateTime() {
    const now  = new Date();
    const time = now.toLocaleTimeString("en-GB", { timeZone: TIMEZONE, hour: "2-digit", minute: "2-digit" });
    const date = now.toLocaleDateString("en-US",  { timeZone: TIMEZONE, month: "short", day: "numeric", year: "numeric" });
    document.getElementById("j-time").textContent = `${time} in ${CITY} — ${date}`;
  }
  updateTime();
  setInterval(updateTime, 30000);

</script>
<!-- END BACKEND -->

</body>
</html>
