<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ============================================================
  EDITABLE
============================================================ -->

<script>

const BACK = "../../";

const TITLE = "Introduction";

const SECTION = "Foundations";

const MARKDOWN = `

This handbook is a personal collection of notes developed while studying Electrical Engineering at the University of British Columbia in Vancouver, Canada. 
It began as an attempt to organize years of scattered notebooks, assignments, lecture slides, lab reports, and project work into a single reference that could be revisited long after graduation.
Whenever possible, topics are presented as they would be taught to someone encountering them for the first time, including my future self.

Many concepts in electrical engineering are only truly understood after seeing them repeatedly in different contexts.
Circuit analysis reappears in electronics. Differential equations emerge again in signals, control systems, electromagnetics, and power systems.
Over time, it became clear that learning a concept once for an exam was very different from understanding it well enough to recall years later.
This handbook exists to bridge that gap.

While the material was largely learned through UBC's Electrical Engineering program, the notes are grouped by subject area so they can serve as a practical reference rather than a semester-by-semester archive.

The Foundations section contains general notes, conventions, notation, units, and introductory material that support multiple disciplines.
The remaining sections are organized according to the major areas of electrical engineering and are intended to function as a technical reference library.

These notes are primarily written for personal use.
Nevertheless, they are made publicly available in the hope that other students, engineers, hobbyists, and curious readers may find them useful.
As with any set of engineering notes, errors and omissions are inevitable.

`;

</script>

<!-- ============================================================
  END EDITABLE
============================================================ -->

<style>

* { margin:0; padding:0; box-sizing:border-box; }

body {
  max-width:700px;
  margin:70px auto;
  padding:0 20px;
  font:12px/1.7 Inter, sans-serif;
  background:#fff;
  color:#111;
}

a { color:inherit; text-decoration:none; }

.back {
  display:inline-block;
  margin-bottom:40px;
  color:#777;
}

.back:hover { color:#111; }

.note-section {
  color:#777;
  margin-bottom:6px;
}

.note-title {
  font-size:12px;
  font-weight:400;
  margin-bottom:40px;
}

.note-content {
  line-height:1.8;
}

.note-content h1,
.note-content h2,
.note-content h3 {
  font-size:12px;
  font-weight:500;
  margin-top:32px;
  margin-bottom:12px;
}

.note-content p {
  margin-bottom:14px;
}

.note-content ul {
  padding-left:18px;
  margin-bottom:14px;
}

.note-content li {
  margin-bottom:4px;
}

.note-content code {
  font-family:monospace;
  background:#f5f5f5;
  padding:1px 4px;
}

.note-content pre {
  background:#f5f5f5;
  padding:12px;
  overflow-x:auto;
  margin-bottom:14px;
}

.footer {
  margin-top:80px;
  color:#777;
}

</style>
</head>

<body>

<a class="back" id="j-back">← back</a>

<div class="note-section" id="j-section"></div>

<h1 class="note-title" id="j-title"></h1>

<div class="note-content" id="j-content"></div>

<div class="footer" id="j-time"></div>

<script>

document.getElementById("j-back").href = BACK;

document.getElementById("j-title").textContent = TITLE;

document.getElementById("j-section").textContent = SECTION;

document.getElementById("j-content").innerHTML =
  marked.parse(MARKDOWN);

const TIMEZONE = "Asia/Seoul";
const CITY = "Seoul";

function updateTime() {

  const now = new Date();

  const time =
    now.toLocaleTimeString(
      "en-GB",
      {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  const date =
    now.toLocaleDateString(
      "en-US",
      {
        timeZone: TIMEZONE,
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    );

  document.getElementById("j-time").textContent =
    `${time} in ${CITY} — ${date}`;
}

updateTime();
setInterval(updateTime, 30000);

</script>

</body>
</html>
