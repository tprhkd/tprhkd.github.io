<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peter Kim</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">

<style>
body{
  max-width:480px;
  margin:50px auto;
  padding:0 10px;
  font:12px/1.4 Inter,sans-serif;
  background:#fff;
  color:#111;
}
a{color:inherit;text-decoration:none}
.gray,.entry-description,.footer{color:#777}
.timeline{margin-top:30px}
.entry{padding-bottom:15px}
.entry-title{text-decoration:underline}
.entry-title:hover{text-decoration:none}
.footer{margin-top:80px}
</style>
</head>

<body>

<div>SE KWANG (PETER), KIM</div>
<div class="gray">Electrical Engineer</div>

<div id="timeline" class="timeline"></div>
<div id="time" class="footer"></div>

<script>
const CITIES=[
  ["Seoul","Asia/Seoul"],
  ["Vancouver","America/Vancouver"]
];

const ITEMS=[
["EE for Buildings",2026,"A handbook for MEP electrical engineers in Vancouver, Canada.","notebook-mep/"],
["Capstone",2025,"Built an autonomous drone for Columbia University.","https://github.com/tprhkd/Electrical-Engineering-Capstone-Design-Project"],
["Smart Street Light",2025,"Led the net-zero smart street light design project.","https://github.com/tprhkd/SmartStreetLight"],
["Polaris",2025,"Led firmware development for an autonomous sailboat.","https://github.com/UBCSailbot/com-module-firmware"],
["Machine Learning I",2025,"Implemented Hidden Markov for stock prediction.","https://github.com/tprhkd/Machine-Learning-with-Engineering-Applications"],
["UBC Smart City",2024,"Led a design team and increased its budget by 50%.","assets/sc_annual_23.pdf"],
["Deep Learning I",2024,"Implemented Conditional PixelCNN++ for image classification.","https://github.com/tprhkd/Deep-Learning/blob/main/CPEN355_Final.pdf"],
["Energy Forecasting",2023,"Led the study of energy usage prediction for an undergrad research conference.","https://github.com/tprhkd/EUI_Model"],
["Third-Space",2023,"Led smart home system design for Solar Decathlon 2023.","https://www.thirdquadrantdesign.com/third-space"],
["Design Studio II",2023,"Developed a digital communication system with DE1-SoC.","https://github.com/tprhkd/Electrical-Engineering-Design-Studio-II"],
["Design Studio I",2022,"Built a game, a launch pad and a coin collecting robot with Intel 8051.","https://github.com/tprhkd/Electrical-Engineering-Design-Studio-I"]
];

timeline.innerHTML=ITEMS.map(([t,y,d,h])=>`
<div class="entry">
<a class="entry-title" href="${h}">${t} [${y}]</a>
<span class="entry-description"> - ${d}</span>
</div>`).join("");


function clock(){
  const n=new Date();

  time.textContent=CITIES.map(([city,tz])=>{
    const t=n.toLocaleTimeString("en-GB",{
      timeZone:tz,
      hour:"2-digit",
      minute:"2-digit"
    });

    const d=n.toLocaleDateString("en-US",{
      timeZone:tz,
      month:"short",
      day:"numeric"
    });

    return `${t}, ${d} in ${city}`;
  }).join(" • ");
}
clock();
setInterval(clock,30000);
</script>

</body>
</html>
